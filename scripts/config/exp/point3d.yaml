benchmark_file: ../data/benchmark/ijcai23/main/point3d.jld2

seed_start: 1
seed_end: 10
time_limit_sec: 300

postprocessing:
  - target: send_slack_msg
    params:
      msg: "done: main/point3d"

solvers:
  - target: "MRMP.CBS"
    params:
      num_vertices: 200
      max_makespan: 10
      rad: 1.0
      roadmaps_growing_rate: ~
      collision_weight: 1.0
  - target: "MRMP.PP"
    params:
      num_vertices: 100
      max_makespan: 10
      rad: ~
      roadmaps_growing_rate: 1.0
  - target: "MRMP.PRM_direct"
    params:
      epsilon: ~
  - target: "MRMP.RRT"
    params:
      steering_depth: 4
      epsilon: ~
  - target: "MRMP.RRT_connect"
    params:
      steering_depth: 2
      epsilon: 1.0
  - target: "MRMP.SSSP"
    params:
      init_min_dist_thread: 0.1
      decreasing_rate_min_dist_thread: 0.5
      steering_depth: 1
      epsilon: 0.5
      num_vertex_expansion: 5
