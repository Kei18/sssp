name: CI

on:
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/*.jl'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1.8']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v2
      - name: "setup julia"
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
